# Relay allowlist. Jobs name a relay by id.
default: moqx-main

relays:
  moqx-main:
    name: moqx main (OpenMOQ CI)
    endpoints:
      moqt: moqt://moqx-main.ci.openmoq.org:4433
      webtransport: https://moqx-main.ci.openmoq.org:4433/moq-relay
    drafts: [16, 18]
    default_draft: 18  # moqx negotiates 16 when offered both
  aiomoqt-relay:
    name: aiomoqt relay (tracks aiomoqt dev builds)
    endpoints:
      moqt: moqt://aiomoqt-relay.marzresearch.net:4443
      webtransport: https://aiomoqt-relay.marzresearch.net:4443/
    drafts: [14, 16, 18, 20, 22]
    default_draft: 18
  us-ord-3:
    name: moqx us-ord-3
    endpoints:
      moqt: moqt://us-ord-3.moqx.akaleapi.net:443
      webtransport: https://us-ord-3.moqx.akaleapi.net:443/moq-relay
    drafts: [16, 18]
    default_draft: 18
