# Service limits. Every token gets per_key_defaults; admin tokens and tokens of
# tier unrestricted may exceed them, never the global caps (docs/admin.md).
namespace_prefix: [openmoq]  # tool id is appended

global:
  max_jobs: 16
  # The CPU guard, in 1080p30 encodes: a live job counts its video tracks' pixel
  # rate (720p30 0.44, 1080p60 2), at least 0.25. Cached loops count nothing.
  max_live_encodes: 4
  max_ttl_s: 86400

per_key_defaults:
  max_jobs: 16
  default_ttl_s: 1800
  max_ttl_s: 3600
  max_height: 1080
  max_fps: 60
  max_video_kbps: 16000  # all of a job's video tracks together

rate_limits:
  api_per_min: 60
  failed_logins_per_ip_per_hour: 10

custom_relays:
  scope: admin
  schemes: [moqt, https]
  allow_private_addresses: false
