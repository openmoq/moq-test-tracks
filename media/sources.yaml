# Clips this deployment serves for content `clip`. A clip's id is the
# namespace prefix field after the tool id:
#   openmoq/mtt/<tool>/<clip id>/moq_test_tracks_00/…
# `mtt media fetch <id>` records capture_s seconds from url into the runner
# cache; jobs encode that recording to each requested shape.
clips:
  akamai_test:
    title: Akamai test channel
    url: https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8
    capture_s: 120
    license: Akamai-hosted live stream, used with Akamai's permission (Will Law)
    attribution: Akamai test channel

  nasa_tv:
    title: NASA TV
    url: https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8
    capture_s: 120
    license: Akamai-hosted NASA TV stream, used with Akamai's permission (Will Law)
    attribution: NASA TV via Akamai

  bbb_4k30:
    title: Big Buck Bunny 4K30 (Akamai-hosted)
    url: https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd
    start_s: 90
    capture_s: 120
    license: CC-BY 3.0, Blender Foundation (www.bigbuckbunny.org); Akamai-hosted DASH ladder, top rung 4K30 about 12 Mbps
    attribution: Big Buck Bunny © 2008 Blender Foundation | www.bigbuckbunny.org

  bbb_4k60:
    title: Big Buck Bunny 4K60
    url: https://mirrors.mit.edu/kodi/demo-files/BBB/bbb_sunflower_2160p_60fps_normal.mp4
    start_s: 40  # the mirror's copy ends about 170 s in
    capture_s: 120
    license: CC-BY 3.0, Blender Foundation (www.bigbuckbunny.org); Kodi demo-files mirror
    attribution: Big Buck Bunny © 2008 Blender Foundation | www.bigbuckbunny.org

  akamai_cmaf:
    title: Akamai live CMAF channel
    url: https://akamaibroadcasteruseast.akamaized.net/cmaf/live/657078/akasource/out.mpd
    capture_s: 120
    license: Akamai-hosted live stream, used with Akamai's permission (Will Law)
    attribution: Akamai live channel

  # Artemis II launch (2026-04-01), nine views synced to one 150 s window with
  # T0 at 10 s and keyframes every 2 s in every feed. NASA footage and audio,
  # from openmoq/FFmpeg's multi-view demo set. Import the set into
  # <var>/media/artemis (out/synced, out/audio), then `mtt media import <id>`.

  artemis_tv:
    title: "Artemis II launch: NASA TV launch coverage"
    video: artemis/synced/tv.mp4
    audio: artemis/audio/tv.m4a
    capture_s: 150
    loop_s: 150
