[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moq-test-tracks"
version = "0.0.0"
description = "On-demand MoQT media test tracks, encoded in the track namespace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenMOQ contributors" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/openmoq/moq-test-tracks"

[tool.hatch.build.targets.wheel]
packages = ["src/moq_test_tracks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
