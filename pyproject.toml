[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moq-test-tracks"
version = "0.0.0"
description = "On-demand MoQT media test tracks, encoded in the track namespace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenMOQ contributors" }]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "cbor2>=5.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
mtt = "moq_test_tracks.cli:main"

[project.urls]
Repository = "https://github.com/openmoq/moq-test-tracks"

[tool.hatch.build.targets.wheel]
packages = ["src/moq_test_tracks"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["adapters/*/run"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e"]
markers = ["e2e: end to end with real tools and a local relay (MTT_E2E=1; tests/e2e)"]
