name: ci main

# The exhaustive tier: thorough property tests with coverage, the service
# image, and end-to-end publishing through a local relay inside that image.
# Pull requests run it only when they change the image or this tier.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/ci-main.yml
      - docker/**
      - tests/e2e/**
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=moq_test_tracks --cov-report=
        env:
          HYPOTHESIS_PROFILE: thorough
          MTT_SUMMARY_TITLE: Unit tests (thorough)
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage: $(coverage report --format=total)%"
            echo
            echo "<details><summary>By file</summary>"
            echo
            coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t mtt:ci .
      - name: Pins
        run: |
          pinned() { sed -n "s/^ARG $1=\"$2==\(.*\)\"/\1/p" docker/Dockerfile; }
          installed() { docker run --rm --entrypoint python mtt:ci -c "from importlib.metadata import version; print(version('$1'))"; }
          manifest=$(sed -n 's/^version: //p' adapters/aiomoqt/manifest.yaml)
          ok=0
          {
            echo "### Service image"
            echo
            echo "| Package | Pinned | Installed | Manifest |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "AIOMOQT aiomoqt" "AIOPQUIC aiopquic"; do
            set -- $row
            want=$(pinned "$1" "$2"); got=$(installed "$2")
            m=$([ "$2" = aiomoqt ] && echo "$manifest" || echo -)
            echo "| $2 | ${want:-not a == pin} | $got | $m |" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$want" ] || [ "$want" = "$got" ] || ok=1
            [ "$2" != aiomoqt ] || [ -z "$want" ] || [ "$manifest" = "$want" ] || ok=1
          done
          docker run --rm mtt:ci --help > /dev/null
          exit $ok
      - name: End to end
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --user 0 --entrypoint sh \
            -e MTT_E2E=1 -e GITHUB_STEP_SUMMARY=/out/summary.md \
            -e MTT_SUMMARY_TITLE="End to end (service image)" \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" mtt:ci \
            -c 'pip install --no-cache-dir --quiet --root-user-action=ignore --disable-pip-version-check "pytest>=8" && cd /src && python -m pytest -q -p no:cacheprovider -m e2e tests/e2e'
      - name: End-to-end summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
