# Contract: docs/tool-contract.md#manifest
contract_version: 1
id: aiomoqt
name: aiomoqt pub_media
repository: https://github.com/gmarzot/aiomoqt
version: 0.13.1
protocols: [moq_test_tracks_00]
sources: [mpegts, mp4]
stop:
  signal: SIGINT  # pub_media has no SIGTERM handler
  grace_s: 3
capabilities:
  catalog: [msf, cmsf]
  packaging: [loc, cmaf, locmaf]
  video_codec: [h264, av1, none]
  audio_codec: [aac, none]
  video_forwarding: [0]
  audio_forwarding: [0, 3]
  audio_frames_per_group: [1]
  transport: [moqt, webtransport]
  datagram_transport: [moqt]
  draft: [14, 16, 18, 20, 22]
  mode: [namespace, publish]
  max_endpoints: 8
