# Contract: docs/tool-contract.md#manifest
contract_version: 2
id: moq2ts
name: moq2ts-cli
repository: https://github.com/openmoq/moq2ts
version: 1.4.0-rc3
protocols: [mtt_00]
sources: [mpegts]
stop:
  signal: SIGINT
  grace_s: 5
capabilities:
  catalog: [msf]
  init_data: [catalog]
  packaging: [msfts]
  video_codec: [mpeg2]
  audio_codec: [mp2, none]
  transport: [moqt]
  draft: [14, 16, 18, 22]
  mode: [namespace]  # serves SUBSCRIBE; sends no PUBLISH
  max_endpoints: 1
