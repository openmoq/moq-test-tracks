# Scrapes node-exporter (host) and the runner's /metrics (service).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["172.31.250.1:9100"]
  - job_name: mtt
    scrape_interval: 5s
    static_configs:
      - targets: ["runner:8090"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
