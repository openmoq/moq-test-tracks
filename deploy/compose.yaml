# moq-test-tracks: Caddy (TLS, the only published ports) -> api -> runner,
# plus Prometheus, node-exporter and Grafana (behind the api's login).
# Secrets and hostnames come from deploy/.env (see .env.example).
name: moq-test-tracks

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
  restart: unless-stopped

services:
  proxy:
    <<: *hardening
    image: caddy:2.8.4-alpine
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment:
      MTT_HOSTNAMES: ${MTT_HOSTNAMES:?set MTT_HOSTNAMES in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge: {}
      obs-proxy: {ipv4_address: 172.31.251.2}  # the one address Grafana takes identity from
    depends_on: [api, grafana]

  api:
    <<: *hardening
    build: {context: .., dockerfile: docker/Dockerfile}
    image: moq-test-tracks:local
    command: ["api", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      MTT_RUNNER_URL: http://runner:8090
      MTT_RUNNER_TOKEN: ${MTT_RUNNER_TOKEN:?run deploy.sh to generate secrets}
      MTT_SESSION_SECRET: ${MTT_SESSION_SECRET:?run deploy.sh to generate secrets}
      MTT_PUBLIC_ORIGINS: ${MTT_PUBLIC_ORIGINS:?set MTT_PUBLIC_ORIGINS in .env}
      MTT_DB: /var/lib/mtt/api.sqlite
      MTT_TRUST_PROXY: "1"
    volumes: [mtt-api:/var/lib/mtt]
    networks: [edge, internal]
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: [runner]

  runner:
    <<: *hardening
    image: moq-test-tracks:local
    command: ["runner", "--host", "0.0.0.0", "--port", "8090", "--var", "/var/lib/mtt/var"]
    environment:
      MTT_RUNNER_TOKEN: ${MTT_RUNNER_TOKEN:?run deploy.sh to generate secrets}
      MTT_JOB_NICE: "10"
      MTT_VAR: /var/lib/mtt/var
    volumes: [mtt-runner:/var/lib/mtt]
    networks: [internal, egress]
    cpus: 8
    mem_limit: 8g
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Host metrics. Host network and PID namespaces are needed to see the host's
  # interfaces and processes; it listens only on the obs bridge address.
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.31.250.1:9100
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]
    cpus: 0.5
    mem_limit: 128m

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [obs, internal]
    cpus: 1
    mem_limit: 1g
    depends_on: [node-exporter, runner]

  grafana:
    <<: *hardening
    image: grafana/grafana:12.4.6
    environment:
      GF_SERVER_ROOT_URL: ${MTT_PUBLIC_ORIGINS}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${MTT_GRAFANA_ADMIN_PASSWORD:?run deploy.sh to generate secrets}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      # Identity comes only from Caddy, after the api accepted the session or key.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE Name:X-WEBAUTH-NAME
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 172.31.251.2
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/service.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [obs, obs-proxy]
    cpus: 1
    mem_limit: 512m
    depends_on: [prometheus]

networks:
  edge: {}
  internal: {internal: true}
  egress: {}
  obs:
    internal: true
    ipam: {config: [{subnet: 172.31.250.0/24, gateway: 172.31.250.1}]}
  obs-proxy:
    internal: true
    # Dynamic addresses come from the upper half, so the proxy's .2 stays free.
    ipam: {config: [{subnet: 172.31.251.0/24, ip_range: 172.31.251.128/25, gateway: 172.31.251.1}]}

volumes:
  caddy-data: {}
  caddy-config: {}
  mtt-api: {}
  mtt-runner: {}
  prometheus-data: {}
  grafana-data: {}
